name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" ditekan secara manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7' # Memanggil gradle murni karena komputer lokal tidak punya gradlew

    - name: Build APK (Debug + Release)
      run: gradle assembleDebug assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Optimizer-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
